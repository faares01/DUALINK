name: Build desktop installers

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            command: npm run dist
          - os: windows-latest
            command: npm run dist
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop/electron
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/electron/package-lock.json
      - run: npm ci
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libarchive-tools
      - run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: DUALINK-${{ runner.os }}
          path: |
            desktop/electron/dist/*.AppImage
            desktop/electron/dist/*.deb
            desktop/electron/dist/*.rpm
            desktop/electron/dist/*.pacman
            desktop/electron/dist/*.exe
            desktop/electron/dist/*.yml
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
